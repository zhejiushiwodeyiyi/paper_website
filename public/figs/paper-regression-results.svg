<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fbff"/>
  <rect x="40" y="40" width="1120" height="680" rx="24" fill="#ffffff" stroke="#c8d8ee" stroke-width="3"/>
  <text x="80" y="110" font-family="Georgia, serif" font-size="42" fill="#0f172a">Cross-sectional and Longitudinal Associations with RBANS Total</text>
  <line x1="600" y1="165" x2="600" y2="690" stroke="#94a3b8" stroke-width="2"/>

  <text x="80" y="170" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Cross-sectional adjusted associations</text>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="24" fill="#991b1b">PHQ-9 total: β = -0.029 [-0.048, -0.011], FDR p = 0.004</text>
  <line x1="305" y1="245" x2="470" y2="245" stroke="#dc2626" stroke-width="4"/><circle cx="392" cy="245" r="9" fill="#dc2626"/>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="24" fill="#991b1b">GAD-7 total: β = -0.037 [-0.053, -0.021], FDR p &lt; 0.001</text>
  <line x1="250" y1="325" x2="430" y2="325" stroke="#b91c1c" stroke-width="4"/><circle cx="340" cy="325" r="9" fill="#b91c1c"/>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="24" fill="#475569">PSS total: β = -0.026 [-0.052, 0.000], FDR p = 0.053</text>
  <line x1="260" y1="405" x2="600" y2="405" stroke="#64748b" stroke-width="4"/><circle cx="445" cy="405" r="9" fill="#64748b"/>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="24" fill="#475569">ISI total: β = -0.018 [-0.036, -0.001], FDR p = 0.053</text>
  <line x1="350" y1="485" x2="535" y2="485" stroke="#64748b" stroke-width="4"/><circle cx="470" cy="485" r="9" fill="#64748b"/>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Baseline-adjusted longitudinal associations</text>
  <text x="80" y="620" font-family="Arial, sans-serif" font-size="24" fill="#475569">HAMD-17 total: β = -0.031 [-0.057, -0.005], FDR p = 0.052</text>
  <line x1="320" y1="645" x2="458" y2="645" stroke="#64748b" stroke-width="4"/><circle cx="383" cy="645" r="9" fill="#64748b"/>
  <text x="650" y="220" font-family="Arial, sans-serif" font-size="24" fill="#475569">PHQ-9 total: β = 0.007 [-0.017, 0.030], FDR p = 0.577</text>
  <line x1="690" y1="245" x2="760" y2="245" stroke="#64748b" stroke-width="4"/><circle cx="715" cy="245" r="9" fill="#64748b"/>
  <text x="650" y="300" font-family="Arial, sans-serif" font-size="24" fill="#475569">GAD-7 total: β = -0.007 [-0.026, 0.012], FDR p = 0.577</text>
  <line x1="640" y1="325" x2="706" y2="325" stroke="#64748b" stroke-width="4"/><circle cx="674" cy="325" r="9" fill="#64748b"/>
  <text x="650" y="380" font-family="Arial, sans-serif" font-size="24" fill="#991b1b">PSS total: β = -0.076 [-0.116, -0.037], FDR p &lt; 0.001</text>
  <line x1="490" y1="405" x2="559" y2="405" stroke="#dc2626" stroke-width="4"/><circle cx="524" cy="405" r="9" fill="#dc2626"/>
  <text x="650" y="460" font-family="Arial, sans-serif" font-size="24" fill="#475569">ISI total: β = -0.012 [-0.033, 0.009], FDR p = 0.416</text>
  <line x1="615" y1="485" x2="689" y2="485" stroke="#64748b" stroke-width="4"/><circle cx="649" cy="485" r="9" fill="#64748b"/>

  <text x="650" y="620" font-family="Arial, sans-serif" font-size="22" fill="#64748b">
    Red rows are the clearest supported associations reported in the manuscript.
  </text>
</svg>
